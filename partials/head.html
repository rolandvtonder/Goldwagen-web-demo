<meta name="theme-color" content="#070B18">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Critical paint: prevents any light flash before the stylesheet lands -->
<style>
  html,body{background:#070B18;color:#fff;margin:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gw:   { red:'#D9272E', dark:'#B01F25', soft:'#FF6B70', blue:'#001689', lift:'#1B2FA8' },
          ink:  { 900:'#070B18', 800:'#0E1430', 700:'#151D42', 600:'#1D2653' },
          muted:'#A5ADC6'
        },
        fontFamily: {
          display: ['Barlow Condensed','sans-serif'],
          body: ['Inter','sans-serif']
        }
      }
    }
  };
</script>

<link rel="stylesheet" href="assets/css/brand.css">

<!-- Local business structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "AutoPartsStore",
  "name": "Goldwagen Alberton",
  "url": "{{SITE}}/",
  "image": "{{SITE}}/mediaa/logo.png",
  "telephone": "+27118694478",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Shop 2, Gateway Centre, Ring Road East",
    "addressLocality": "Alberton",
    "addressRegion": "Gauteng",
    "postalCode": "1449",
    "addressCountry": "ZA"
  },
  "openingHoursSpecification": [
    { "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
      "opens": "08:00", "closes": "17:00" },
    { "@type": "OpeningHoursSpecification",
      "dayOfWeek": "Saturday", "opens": "08:00", "closes": "13:00" }
  ],
  "priceRange": "$$",
  "areaServed": ["Alberton","Germiston","Alrode","Meyersdal","Brackendowns","Johannesburg South"]
}
</script>
